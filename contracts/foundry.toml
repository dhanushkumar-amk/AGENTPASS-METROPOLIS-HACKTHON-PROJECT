[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"

# Monad EVM version: must be verified against official Monad documentation
# (Configured as prague; verify compatibility with current Monad testnet release)
evm_version = "prague"

optimizer = true
optimizer_runs = 200

[rpc_endpoints]
monad_testnet = "${QUICKNODE_RPC_URL}"
