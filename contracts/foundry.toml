[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

# Foundry 1.8.4 natively supports `network = "monad"`, which configures EVM compatibility
# and defaults evm_version to "prague" without requiring manual overrides.
network = "monad"

optimizer = true
optimizer_runs = 200

[profile.ci]
fuzz = { runs = 256 }
invariant = { runs = 256, depth = 50 }

[profile.deep]
fuzz = { runs = 5000 }
invariant = { runs = 512, depth = 100 }

[rpc_endpoints]
monad_testnet = "${QUICKNODE_RPC_URL:-}"
